[package]
name = "zenoh-admin"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
tower-http = { version = "0.6", features = ["fs"] }
zenoh = { version = "=1.10.2", default-features = false, features = ["transport_tcp", "transport_udp"] }
if-addrs = "0.14"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
